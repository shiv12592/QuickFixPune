<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register as a provider | QuickFix Pune</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="provider-registration">
  <header class="topbar">
    <a class="brand" href="/customer"><span class="brand-mark">Q</span><span>QuickFix <b>Pune</b></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation">Menu</button>
    <nav class="site-menu" id="site-menu" hidden>
      <a href="/customer">Customer marketplace</a><a href="/provider">Provider dashboard</a>
      <a href="/placeholder.html?page=Help%20%26%20Support">Help &amp; Support</a>
    </nav>
  </header>
  <main class="page-wrap narrow-wrap">
    <a class="back-link" href="/customer">← Customer marketplace</a>
    <section class="page-intro"><p class="eyebrow">GROW WITH QUICKFIX</p><h1>Register as a provider</h1><p class="muted">Share your service details to create a local profile. New profiles are marked pending verification.</p></section>
    <section class="panel request-panel">
      <form id="provider-registration-form">
        <div class="field"><label for="name">Full name</label><input id="name" name="name" maxlength="100" autocomplete="name" required></div>
        <div class="field"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit Indian mobile number" required></div>
        <div class="field"><label for="service">Service</label><select id="service" name="service" required>
          <option value="">Select your service</option><option>Plumber</option><option>Electrician</option><option>AC Repair</option><option>Carpenter</option><option>Painter</option><option>Appliance Repair</option><option>Cleaning</option><option>Pest Control</option><option>Other</option>
        </select></div>
        <div class="field"><label for="experience">Experience (years)</label><input id="experience" name="experience" type="number" min="0" max="60" step="1" value="0" required></div>
        <div class="field"><label for="address">Full address <span class="optional">private</span></label><textarea id="address" name="address" rows="3" maxlength="250" autocomplete="street-address" required></textarea></div>
        <div class="field"><label for="area">Area</label><input id="area" name="area" maxlength="80" required></div>
        <div class="field"><label for="pincode">Pincode</label><input id="pincode" name="pincode" inputmode="numeric" maxlength="6" required></div>
        <div id="registration-feedback" class="feedback" role="status" hidden></div>
        <button id="register-provider" class="button button-primary full-button" type="submit">Submit for verification <span aria-hidden="true">→</span></button>
      </form>
      <a id="provider-dashboard-link" class="button button-secondary full-button dashboard-return" href="/provider" hidden>Open provider dashboard <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <script src="/js/app.js" defer></script>
  <script src="/js/provider-register.js" defer></script>
</body>
</html>
