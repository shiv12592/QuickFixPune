<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat | QuickFix Pune</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-user-type="CUSTOMER" data-auth-role="CUSTOMER">
  <header class="topbar">
    <a class="brand" href="/customer"><span class="brand-mark">Q</span><span>QuickFix <b>Pune</b></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation">Menu</button>
    <nav class="site-menu" id="site-menu" hidden><a href="/customer">Home</a><a href="/customer-chats.html">My Chats</a><a href="/provider">Provider portal</a><button type="button" class="menu-link" data-logout>Sign out</button></nav>
  </header>
  <main class="page-wrap narrow-wrap">
    <a class="back-link" href="/customer-chats.html">← My Chats</a>
    <section class="panel chat-panel">
      <header class="chat-header">
        <div><p class="eyebrow">QUICKFIX CONVERSATION</p><h1 id="chat-title">Loading chat…</h1><p id="chat-subtitle" class="muted"></p></div>
        <span id="chat-status" class="availability-badge" hidden></span>
      </header>
      <div id="chat-error" class="feedback feedback-error" role="alert" hidden></div>
      <div id="typing-indicator" class="typing-indicator" aria-live="polite" hidden>Provider is typing…</div>
      <ol id="messages" class="message-list" aria-live="polite"><li class="loading-state">Loading messages…</li></ol>
      <form id="message-form" class="message-form">
        <label class="visually-hidden" for="message-input">Your message</label>
        <textarea id="message-input" rows="1" maxlength="1000" placeholder="Write a message…" required></textarea>
        <button class="button button-primary" type="submit" aria-label="Send message">Send</button>
      </form>
      <p class="field-note">Messages are limited to 1000 characters.</p>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/chat.js" defer></script>
</body>
</html>
